<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Tiempo en diferentes ciudades</h1>
    <input type="button" id="boton" value="Ver">
    <div id="resultado"></div>
 
    <script>
        let boton = document.getElementById("boton");
        let resultado = document.getElementById("resultado");
 
        let zonas = [
            "Europe/London", "Europe/Madrid", "Asia/Tokyo",
            "America/New_York", "America/Los_Angeles", "Europe/Paris",
            "Europe/Berlin", "Europe/Moscow", "Asia/Dubai",
            "America/Argentina/Buenos_Aires", "America/Sao_Paulo", "Chile/Continental"
        ];
 
        function esperar(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
 
        function cargarHoraCiudad(zona) {
            let url = "http://worldtimeapi.org/api/timezone/" + zona;
 
            fetch(url)
                .then(response => {
                    return response.json();
                })
                .then(data => {
                    let h = String(data.hour).padStart(2, "0");
                    let m = String(data.minute).padStart(2, "0");
                    let id = "card-" + zona.replace(/\//g, "_");
                    document.getElementById(id).querySelector(".hora").textContent = h + ":" + m;
                })
                .catch(
                    error => console.log("Error: " + error)
                );
        }
 
        async function verTodo() {
            resultado.innerHTML = "";
 
            for (ciudad of zonas) {
                let card = document.createElement("div");
                card.className = "card";
                card.id = "card-" + ciudad.replace(/\//g, "_");
                card.innerHTML = `<div class="zona">${ciudad}</div><div class="hora">...</div>`;
                resultado.appendChild(card);
 
                cargarHoraCiudad(ciudad);
 
                await esperar(900);
            }
        }
 
        boton.addEventListener("click", (e) => {
            verTodo();
            console.log("Me han pulsado");
        });
    </script>
</body>
</html>
